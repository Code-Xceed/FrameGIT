<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FrameGit</title>
  <style>
    :root {
      --bg-dark: #1e1e1e;
      --bg-panel: #262626;
      --bg-card: #2e2e2e;
      --border-color: #3d3d3d;
      --text-main: #e8e8e8;
      --text-muted: #9a9a9a;
      --accent-blue: #0d6efd;
      --accent-hover: #0b5ed7;
      --badge-added: #198754;
      --badge-modified: #fd7e14;
      --badge-deleted: #dc3545;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background-color: rgba(25, 135, 84, 0.2);
      color: #75b798;
      border: 1px solid rgba(25, 135, 84, 0.4);
    }

    .status-pill.offline {
      background-color: rgba(220, 53, 69, 0.2);
      color: #ea868f;
      border-color: rgba(220, 53, 69, 0.4);
    }

    .section {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .branch-selector {
      width: 100%;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    .changes-badge {
      background: #3b3b3b;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
    }

    .changes-list {
      max-height: 140px;
      overflow-y: auto;
      margin-bottom: 8px;
    }

    .change-item {
      padding: 5px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .change-tag {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .tag-moved { background: var(--badge-modified); color: white; }
    .tag-added { background: var(--badge-added); color: white; }
    .tag-deleted { background: var(--badge-deleted); color: white; }
    .tag-effect { background: #6f42c1; color: white; }

    .commit-box textarea {
      width: 100%;
      height: 50px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
      resize: none;
      outline: none;
      margin-bottom: 8px;
    }

    .commit-box textarea:focus {
      border-color: var(--accent-blue);
    }

    .btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .history-list {
      flex: 1;
      overflow-y: auto;
      max-height: 200px;
    }

    .history-item {
      padding: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .history-sha {
      font-family: monospace;
      font-weight: 700;
      color: #6ea8fe;
      font-size: 11px;
    }

    .history-time {
      color: var(--text-muted);
      font-size: 10px;
    }

    .history-msg {
      font-size: 11px;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .btn-restore {
      background: #495057;
      color: white;
      border: none;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
    }

    .btn-restore:hover { background: #6c757d; }

    .footer {
      margin-top: auto;
      display: flex;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    .footer .btn {
      flex: 1;
      background: #343a40;
    }

    .footer .btn:hover { background: #495057; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="2" x2="12" y2="8"></line>
        <line x1="12" y1="16" x2="12" y2="22"></line>
      </svg>
      FRAMEGIT
    </div>
    <div id="statusPill" class="status-pill">Connected</div>
  </div>

  <!-- Branch Selector -->
  <div class="section">
    <div class="section-title">Active Branch</div>
    <select id="branchSelect" class="branch-selector"></select>
  </div>

  <!-- Changes Section -->
  <div class="section">
    <div class="section-title">
      Changes
      <span id="changesBadge" class="changes-badge">0</span>
    </div>
    <div id="changesList" class="changes-list">
      <div style="color: var(--text-muted); font-size: 11px; text-align: center; padding: 12px;">No uncommitted changes</div>
    </div>
    <div class="commit-box">
      <textarea id="commitInput" placeholder="Commit message (e.g. Adjusted intro timing)"></textarea>
      <button id="commitBtn" class="btn" disabled>Commit</button>
    </div>
  </div>

  <!-- History Section -->
  <div class="section" style="flex: 1; display: flex; flex-direction: column;">
    <div class="section-title">Project History</div>
    <div id="historyList" class="history-list"></div>
  </div>

  <!-- Cloud Sync Footer -->
  <div class="footer">
    <button id="pushBtn" class="btn">Push</button>
    <button id="pullBtn" class="btn">Pull</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
