<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FrameGit Source Control</title>
  <style>
    :root {
      --vscode-bg: #1e1e1e;
      --vscode-side: #252526;
      --vscode-row-hover: #2a2d2e;
      --vscode-row-active: #37373d;
      --vscode-border: #333333;
      --vscode-text: #cccccc;
      --vscode-text-bright: #ffffff;
      --vscode-text-muted: #858585;
      --vscode-accent: #0078d4;
      --vscode-accent-hover: #026ec1;
      --badge-mod: #e2c08d;
      --badge-add: #73c991;
      --badge-del: #f14c4c;
      --badge-fx: #c586c0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--vscode-side);
      color: var(--vscode-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      line-height: 1.4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
    }

    /* VS Code Title Bar */
    .scm-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--vscode-side);
      border-bottom: 1px solid var(--vscode-border);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--vscode-text-muted);
    }

    .scm-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .scm-icon-btn {
      background: transparent;
      border: none;
      color: var(--vscode-text);
      width: 22px;
      height: 22px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .scm-icon-btn:hover {
      background: var(--vscode-row-hover);
      color: var(--vscode-text-bright);
    }

    /* Scrollable Body */
    .scm-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Project Context Banner */
    .scm-project-context {
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--vscode-border);
    }

    .scm-proj-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--vscode-text-bright);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .scm-proj-title .badge {
      background: #00005b;
      color: #9999ff;
      border: 1px solid #333399;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
    }

    .branch-bar {
      display: flex;
      gap: 6px;
    }

    .branch-select {
      flex: 1;
      background: var(--vscode-bg);
      color: var(--vscode-text);
      border: 1px solid var(--vscode-border);
      padding: 4px 6px;
      border-radius: 3px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    .btn-new-branch {
      background: var(--vscode-bg);
      border: 1px solid var(--vscode-border);
      color: var(--vscode-text);
      padding: 0 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-new-branch:hover {
      background: var(--vscode-row-hover);
      color: var(--vscode-text-bright);
    }

    /* Un-tracked project prompt */
    .scm-untracked-box {
      margin: 10px 12px;
      padding: 10px;
      background: rgba(0, 120, 212, 0.1);
      border: 1px solid rgba(0, 120, 212, 0.3);
      border-radius: 4px;
      text-align: center;
    }

    .scm-untracked-box p {
      font-size: 11px;
      color: var(--vscode-text-bright);
      margin-bottom: 8px;
    }

    /* Commit Box */
    .scm-commit-container {
      padding: 10px 12px;
      border-bottom: 1px solid var(--vscode-border);
    }

    .scm-commit-input {
      width: 100%;
      height: 48px;
      background: var(--vscode-bg);
      border: 1px solid var(--vscode-border);
      color: var(--vscode-text-bright);
      padding: 6px 8px;
      font-size: 11px;
      font-family: inherit;
      border-radius: 3px;
      resize: none;
      outline: none;
      margin-bottom: 6px;
    }

    .scm-commit-input:focus {
      border-color: var(--vscode-accent);
    }

    .btn-primary {
      width: 100%;
      background: var(--vscode-accent);
      color: white;
      border: none;
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:hover {
      background: var(--vscode-accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Section Accordion */
    .scm-section {
      border-bottom: 1px solid var(--vscode-border);
    }

    .scm-section-header {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.1);
    }

    .scm-section-title-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scm-counter {
      background: #3b3b3b;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--vscode-text-bright);
    }

    .scm-changes-list {
      max-height: 180px;
      overflow-y: auto;
    }

    .scm-change-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .scm-change-row:hover {
      background: var(--vscode-row-hover);
    }

    .scm-change-info {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    .scm-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
      text-transform: uppercase;
    }

    .scm-badge.mod { background: rgba(226, 192, 141, 0.2); color: var(--badge-mod); }
    .scm-badge.add { background: rgba(115, 201, 145, 0.2); color: var(--badge-add); }
    .scm-badge.del { background: rgba(241, 76, 76, 0.2); color: var(--badge-del); }
    .scm-badge.fx  { background: rgba(197, 134, 192, 0.2); color: var(--badge-fx); }

    /* Remote Sync Bar */
    .scm-sync-bar {
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      background: var(--vscode-bg);
      border-bottom: 1px solid var(--vscode-border);
    }

    .btn-secondary {
      flex: 1;
      background: #333333;
      color: var(--vscode-text-bright);
      border: 1px solid #444444;
      border-radius: 3px;
      padding: 5px 8px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-secondary:hover {
      background: #444444;
    }

    /* History List */
    .scm-history-list {
      max-height: 220px;
      overflow-y: auto;
    }

    .scm-commit-row {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .scm-commit-row:hover {
      background: var(--vscode-row-hover);
    }

    .scm-commit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .scm-commit-sha {
      font-family: monospace;
      font-weight: 700;
      color: #6ea8fe;
      font-size: 10px;
    }

    .scm-commit-time {
      font-size: 10px;
      color: var(--vscode-text-muted);
    }

    .scm-commit-msg {
      font-size: 11px;
      color: var(--vscode-text-bright);
      word-break: break-word;
    }

    .scm-commit-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
    }

    .scm-commit-author {
      font-size: 10px;
      color: var(--vscode-text-muted);
    }

    .btn-restore-small {
      background: #3c3c3c;
      color: var(--vscode-text-bright);
      border: 1px solid #555555;
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 10px;
      cursor: pointer;
    }

    .btn-restore-small:hover {
      background: #505050;
    }

    /* Bottom Status Bar */
    .scm-status-bar {
      margin-top: auto;
      padding: 4px 12px;
      background: var(--vscode-bg);
      border-top: 1px solid var(--vscode-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--vscode-text-muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #73c991;
      display: inline-block;
    }

    .status-dot.offline {
      background: #f14c4c;
    }
  </style>
</head>
<body>
  <!-- VS Code Source Control Header -->
  <div class="scm-title-bar">
    <span>Source Control: FrameGit</span>
    <div class="scm-actions">
      <button class="scm-icon-btn" id="btnRefresh" title="Refresh Working Tree">↻</button>
      <button class="scm-icon-btn" id="btnDiff" title="View Timeline Visual Diff">☷</button>
      <button class="scm-icon-btn" id="btnDiscard" title="Discard All Changes">↺</button>
    </div>
  </div>

  <div class="scm-body">
    <!-- Active Project & Branch Context -->
    <div class="scm-project-context" id="projectContextArea">
      <div class="scm-proj-title">
        <span class="badge">Pr</span>
        <span id="projNameLabel">Loading Project...</span>
      </div>
      <div class="branch-bar">
        <select id="branchSelector" class="branch-select"></select>
        <button class="btn-new-branch" id="btnNewBranch" title="New Branch">+</button>
      </div>
    </div>

    <!-- Untracked Project Alert (Hidden by default) -->
    <div id="untrackedNotice" class="scm-untracked-box" style="display: none;">
      <p id="untrackedText">Active project is not tracked in FrameGit</p>
      <button class="btn-primary" id="btnTrackActiveProject">+ Track in FrameGit</button>
    </div>

    <!-- Commit / Checkpoint Box -->
    <div class="scm-commit-container">
      <textarea id="commitMessageInput" class="scm-commit-input" placeholder="Message (Ctrl+Enter to commit)"></textarea>
      <button class="btn-primary" id="btnCommit" disabled>
        <span>✓ Commit Checkpoint</span>
      </button>
    </div>

    <!-- Remote Sync Actions -->
    <div class="scm-sync-bar">
      <button class="btn-secondary" id="btnSync" title="Pull then Push">
        <span>☁ Sync</span>
      </button>
      <button class="btn-secondary" id="btnPull" title="Pull remote changes">
        <span>↓ Pull</span>
      </button>
      <button class="btn-secondary" id="btnPush" title="Push to remote">
        <span>↑ Push</span>
      </button>
    </div>

    <!-- Working Tree Changes -->
    <div class="scm-section">
      <div class="scm-section-header">
        <div class="scm-section-title-left">
          <span>Changes</span>
          <span class="scm-counter" id="changesCountBadge">0</span>
        </div>
        <span style="font-size: 10px; color: var(--vscode-text-muted);">Working Tree</span>
      </div>
      <div class="scm-changes-list" id="changesListContainer">
        <div style="color: var(--vscode-text-muted); padding: 12px; text-align: center;">No changes detected</div>
      </div>
    </div>

    <!-- Timeline History -->
    <div class="scm-section" style="flex: 1; border-bottom: none;">
      <div class="scm-section-header">
        <div class="scm-section-title-left">
          <span>Timeline History</span>
          <span class="scm-counter" id="historyCountBadge">0</span>
        </div>
      </div>
      <div class="scm-history-list" id="historyListContainer"></div>
    </div>
  </div>

  <!-- Bottom Status Bar -->
  <div class="scm-status-bar">
    <div style="display: flex; align-items: center; gap: 5px;">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">Connected to FrameGit Desktop</span>
    </div>
    <span id="remoteSyncLabel">Local-first</span>
  </div>

  <script src="index.js"></script>
</body>
</html>
