<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameGit Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Window Drag Header / Titlebar -->
  <header class="app-header">
    <div class="header-left">
      <div class="header-brand" id="header-brand-btn" title="Return to All Projects" style="cursor: pointer;">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M3 12h6m6 0h6M12 3v6m0 6v6"></path>
          </svg>
        </div>
        <span class="header-title">FrameGit</span>
      </div>

      <!-- Navigation & Project Switcher Dropdown in Topbar -->
      <div class="topbar-context-section" id="topbar-context-section" style="display: none;">
        <div class="topbar-divider"></div>
        <div class="topbar-menu-anchor">
          <button class="topbar-switcher-btn" id="topbar-project-btn" title="Switch Project">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="topbar-switcher-label" id="topbar-project-label">All Projects</span>
            <svg class="chevron-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M6 9l6 6 6-6"></path>
            </svg>
          </button>
          <div class="topbar-dropdown-menu" id="topbar-project-dropdown" style="display: none;">
            <div class="dropdown-header">Tracked Projects</div>
            <div class="dropdown-items" id="topbar-project-dropdown-list"></div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-action-btn" id="topbar-dropdown-add-project">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              <span>Track New Project...</span>
            </button>
          </div>
        </div>

        <!-- Branch Switcher (shown when a project is open) -->
        <div class="topbar-menu-anchor" id="topbar-branch-anchor" style="display: none;">
          <button class="topbar-switcher-btn" id="topbar-branch-btn" title="Current Branch">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="6" y1="3" x2="6" y2="15"></line>
              <circle cx="18" cy="6" r="3"></circle>
              <circle cx="6" cy="18" r="3"></circle>
              <path d="M18 9a9 9 0 0 1-9 9"></path>
            </svg>
            <span class="topbar-switcher-label" id="topbar-branch-label">main</span>
            <svg class="chevron-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M6 9l6 6 6-6"></path>
            </svg>
          </button>
          <div class="topbar-dropdown-menu" id="topbar-branch-dropdown" style="display: none;">
            <div class="dropdown-header">Branches</div>
            <div class="dropdown-items" id="topbar-branch-dropdown-list"></div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-action-btn" id="topbar-dropdown-new-branch">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              <span>Create New Branch...</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="header-right">
      <div class="bridges-status-group" id="header-bridges-group" style="display: none;">
        <div class="bridge-indicator" id="bridge-indicator-pr" title="Adobe Premiere Pro bridge">
          <span class="bridge-tag pr">Pr</span>
          <span class="bridge-dot" id="dot-bridge-pr"></span>
        </div>
        <div class="bridge-indicator" id="bridge-indicator-dr" title="DaVinci Resolve bridge">
          <span class="bridge-tag dr">Dr</span>
          <span class="bridge-dot" id="dot-bridge-dr"></span>
        </div>
      </div>

      <div class="header-status" id="header-status">
        <span class="status-dot"></span>
        <span class="status-label">Initial Setup</span>
      </div>

      <!-- Account Profile Button & Popover -->
      <div class="account-menu-container" id="account-menu-container" style="display: none;">
        <button class="account-trigger-btn" id="account-trigger-btn" title="GitHub Account Menu">
          <img class="account-avatar-small" id="account-avatar-small" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="avatar" />
          <span class="account-name-small" id="account-name-small">Account</span>
          <svg class="chevron-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </button>

        <!-- Account Flyout Popover -->
        <div class="account-popover" id="account-popover" style="display: none;">
          <div class="popover-profile">
            <img class="popover-avatar" id="popover-avatar" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="avatar" />
            <div class="popover-meta">
              <div class="popover-name" id="popover-name">Editor</div>
              <div class="popover-handle" id="popover-handle">@github</div>
              <div class="popover-email" id="popover-email"></div>
            </div>
          </div>

          <div class="popover-badge-row">
            <span class="popover-status-badge">● GitHub Connected</span>
            <span class="popover-scope-badge">Full Repo</span>
          </div>

          <div class="popover-divider"></div>

          <div class="popover-menu-list">
            <button class="popover-item" id="menu-sync-git">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
              </svg>
              <span>Sync Git Author Identity</span>
            </button>
            <button class="popover-item" id="menu-view-github">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"></path>
              </svg>
              <span>View GitHub Profile</span>
            </button>
            <button class="popover-item" id="menu-refresh-session">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
              <span>Verify & Refresh Session</span>
            </button>
          </div>

          <div class="popover-divider"></div>

          <button class="popover-item popover-danger" id="menu-sign-out">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path>
            </svg>
            <span>Sign Out</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app" class="app-container">
    <div class="loading-spinner-container" id="initial-loader">
      <div class="spinner"></div>
      <p>Initializing FrameGit local environment...</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
