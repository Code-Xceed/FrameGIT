<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameGit Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Window Drag Header / Titlebar -->
  <header class="app-header">
    <div class="header-brand">
      <div class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M3 12h6m6 0h6M12 3v6m0 6v6"></path>
        </svg>
      </div>
      <span class="header-title">FrameGit Desktop</span>
      <span class="header-badge">Local-First</span>
    </div>
    <div class="header-status" id="header-status">
      <span class="status-dot"></span>
      <span class="status-label">Initial Setup</span>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app" class="app-container">
    <div class="loading-spinner-container" id="initial-loader">
      <div class="spinner"></div>
      <p>Initializing FrameGit local environment...</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
